<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { height: 100%; margin: 0; background: #333; }
</style>
</head>
<body>
<div class="h-[500px] w-[300px] bg-red-500 flex items-center justify-center overflow-hidden flex-col">
  <div class="relative inline-block max-h-full max-w-full">
    <img src="https://placehold.co/400x800" class="block max-w-full max-h-full object-contain" style="max-height: 100%; width: auto;" />
    <div class="absolute w-4 h-4 bg-blue-500 rounded-full" style="top: 50%; left: 50%; transform: translate(-50%, -50%);"></div>
    <div class="absolute w-4 h-4 bg-green-500 rounded-full" style="top: 0; left: 0; transform: translate(-50%, -50%);"></div>
    <div class="absolute w-4 h-4 bg-yellow-500 rounded-full" style="top: 100%; left: 100%; transform: translate(-50%, -50%);"></div>
  </div>
</div>
</body>
</html>
